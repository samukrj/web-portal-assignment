<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Portal | Contact</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Campus Portal</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="resources.html">Resources</a>
      <a href="gallery.html">Gallery</a>
      <a href="data.html">Data</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Contact Form</h2>

    <form id="contactForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email">

      <label for="topic">Topic:</label>
      <select id="topic" name="topic">
        <option value="">Choose a topic</option>
        <option value="study">Study</option>
        <option value="events">Events</option>
        <option value="other">Other</option>
      </select>

      <p>Preferred contact:</p>
      <label><input type="radio" name="contactType" value="email"> Email</label>
      <label><input type="radio" name="contactType" value="phone"> Phone</label>

      <label for="message">Message:</label>
      <textarea id="message" name="message"></textarea>

      <label>
        <input type="checkbox" id="agree">
        I agree with the terms
      </label>

      <button type="submit">Send</button>
    </form>

    <p id="formMessage"></p>
  </main>

  <footer>
    <p>&copy; 2026 Campus Portal</p>
  </footer>

  <script src="js/form-validation.js"></script>
</body>
</html>
